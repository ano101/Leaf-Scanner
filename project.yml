name: Leaf
options:
  bundleIdPrefix: ru.kotliar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Подпись включена всегда: без неё codesign не запускается вовсе,
    # и права цели не попадают в подписанный пакет. Для симулятора Xcode
    # подписывает локально сам, для телефона берёт профиль команды.
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8JKKU63BYJ
  # Отладочная сборка подписывается сертификатом разработчика, сборка
  # для магазина — сертификатом распространения. Одна подпись на оба случая
  # не годится: App Store принимает только вторую.
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  Leaf:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Sources/Resources
        buildPhase: resources
    dependencies:
      - package: GRDB
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Leaf
        CFBundleLocalizations:
          - ru
          - en
          - kk
          - uk
          - tr
          - de
          - fr
          - es
          - pt-BR
          - zh-Hans
          - ar
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # На iPad обязательны все четыре положения: без перевёрнутого
        # система не даёт работать в многозадачности, и App Store
        # отклоняет сборку ещё до проверки человеком.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Камера нужна, чтобы сканировать документы. Снимки остаются на устройстве.
        NSPhotoLibraryUsageDescription: Доступ к фотографиям нужен, чтобы взять уже снятые документы. Снимки остаются на устройстве.
        NSFaceIDUsageDescription: Face ID закрывает доступ к вашему архиву документов.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kotliar.leaf
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Первая версия — только iPhone. На тринадцатидюймовом планшете
        # список растягивается во всю ширину, а пустой экран теряется
        # в пустоте: приложение там работает, но не сделано. Растянутый
        # айфонный интерфейс хуже его отсутствия.
        TARGETED_DEVICE_FAMILY: "1"

  LeafTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Leaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kotliar.leaf.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Leaf:
    build:
      targets:
        Leaf: all
    test:
      targets:
        - LeafTests
