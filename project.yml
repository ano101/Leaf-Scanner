name: Leaf
options:
  bundleIdPrefix: ru.kotliar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Подпись «Sign to Run Locally»: без неё codesign не запускается вовсе,
    # и права цели не попадают в подписанный пакет.
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Leaf:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Sources/Resources
        buildPhase: resources
    dependencies:
      - package: GRDB
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Leaf
        CFBundleLocalizations:
          - ru
          - en
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Камера нужна, чтобы сканировать документы. Снимки остаются на устройстве.
        NSFaceIDUsageDescription: Face ID закрывает доступ к вашему архиву документов.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kotliar.leaf
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  LeafTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Leaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kotliar.leaf.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Leaf:
    build:
      targets:
        Leaf: all
    test:
      targets:
        - LeafTests
